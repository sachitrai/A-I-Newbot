<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System - Intro</title>
<style>
/* ===== RESET ===== */
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
overflow: hidden;
font-family: 'Poppins', sans-serif;
background: radial-gradient(circle at top, #000428, #004e92);
height: 100vh;
display: flex;
align-items: center;
justify-content: center;
color: white;
}
canvas {
position: absolute;
top: 0;
left: 0;
z-index: 0;
}
.intro-container {
position: relative;
z-index: 1;
text-align: center;
animation: fadeIn 2s ease-in-out;
}
h1 {
font-size: 3.2rem;
letter-spacing: 2px;
text-shadow: 0 0 20px cyan;
margin-bottom: 10px;
}
p {
font-size: 1.2rem;
color: #aadfff;
margin-bottom: 30px;
}
.enter-btn {
padding: 12px 28px;
font-size: 1.1rem;
font-weight: bold;
border: none;
border-radius: 30px;
background: linear-gradient(90deg, cyan, #00e0ff, #006aff);
color: #001428;
cursor: pointer;
transition: 0.4s;
box-shadow: 0 0 25px cyan;
}
.enter-btn:hover {
transform: scale(1.1);
box-shadow: 0 0 40px #00e0ff;
}
@keyframes fadeIn {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<!-- ===== PARTICLES CANVAS ===== -->
<canvas id="particleCanvas"></canvas>
<!-- ===== INTRO CONTENT ===== -->
<div class="intro-container">
<h1>STUDENT MANAGEMENT SYSTEM</h1>
<p>Manage. Track. Organize — Smartly.</p>
<button class="enter-btn" onclick="enterProject()">Enter Project</button>
</div>
<!-- ===== PARTICLE SCRIPT ===== -->
<script>
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const particles = [];
const numParticles = 120;
class Particle {
constructor() {
this.x = Math.random() * canvas.width;
this.y = Math.random() * canvas.height;
this.size = Math.random() * 3 + 1;
this.speedX = (Math.random() - 0.5) * 1;
this.speedY = (Math.random() - 0.5) * 1;
}
update() {
this.x += this.speedX;
this.y += this.speedY;
// Wrap around edges
if (this.x < 0) this.x = canvas.width;
if (this.x > canvas.width) this.x = 0;
if (this.y < 0) this.y = canvas.height;
if (this.y > canvas.height) this.y = 0;
}
draw() {
ctx.fillStyle = "rgba(0,255,255,0.7)";
ctx.beginPath();
ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
ctx.closePath();
ctx.fill();
}
}
function init() {
for (let i = 0; i < numParticles; i++) {
particles.push(new Particle());
}
}
function connectParticles() {
for (let a = 0; a < particles.length; a++) {
for (let b = a; b < particles.length; b++) {
const dx = particles[a].x - particles[b].x;
const dy = particles[a].y - particles[b].y;
const distance = Math.sqrt(dx * dx + dy * dy);
if (distance < 120) {
ctx.strokeStyle = "rgba(0,255,255,0.1)";
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(particles[a].x, particles[a].y);
ctx.lineTo(particles[b].x, particles[b].y);
ctx.stroke();
}
}
}
}
function animate() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
particles.forEach(p => {
p.update();
p.draw();
